<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OT Light Preloaders</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(180deg,#fff,#EEF7F6);color:#062F31}.wrap{max-width:1200px;margin:0 auto;padding:28px 16px 60px}
h1{margin:0;text-align:center;font:800 clamp(30px,5vw,54px) Fraunces,serif;background:linear-gradient(180deg,#0B6E73,#2BB3B1);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{text-align:center;color:#3f6668;margin:8px auto 24px;max-width:680px;font-size:14.5px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}figure{margin:0;border-radius:20px;overflow:hidden;background:#fff;border:1px solid rgba(43,179,177,.3);box-shadow:0 18px 40px -26px rgba(6,47,49,.45)}
iframe{display:block;width:100%;aspect-ratio:16/10;border:0;background:#fff}figcaption{padding:12px 14px 14px;display:grid;gap:4px;font-size:13.5px;color:#3f6668;line-height:1.5}figcaption b{color:#062F31;font-size:15px}
.act{display:flex;gap:10px;align-items:center;margin-top:4px}.act button{padding:7px 14px;border-radius:999px;border:0;background:#0B6E73;color:#fff;font:600 13px Inter;cursor:pointer}.act a{color:#0B6E73;font-weight:600}
@media (max-width:760px){.grid{grid-template-columns:1fr}iframe{aspect-ratio:9/12}}</style></head><body><div class="wrap">
<h1>OT light preloaders</h1><p class="lead">The original (10) + 5 refined variations · 3.4–4.6 s · one text layer (no doubled letters) · the name stays dark until the light reaches it and stays lit after · CSS/SVG only.</p>
<div class="grid"><figure><iframe src="p10.html" title="10 · Original OT light (reference)" loading="lazy"></iframe><figcaption><b>10 · Original OT light (reference)</b><span>The first version you liked — kept unchanged.</span><span class="act"><button onclick="this.closest('figure').querySelector('iframe').src='p10.html?'+Date.now()">↻ Replay</button><a href="p10.html" target="_blank">Open full screen ↗</a></span></figcaption></figure><figure><iframe src="ot-a.html" title="A · Gliding ceiling lamp · ≈ 3.6 s" loading="lazy"></iframe><figcaption><b>A · Gliding ceiling lamp · ≈ 3.6 s</b><span>The OT lamp glides left → right over the name with a soft beam. Letters stay dark until the beam reaches them and stay lit after; then the room floods with light.</span><span class="act"><button onclick="this.closest('figure').querySelector('iframe').src='ot-a.html?'+Date.now()">↻ Replay</button><a href="ot-a.html" target="_blank">Open full screen ↗</a></span></figcaption></figure><figure><iframe src="ot-b.html" title="B · Swinging lamp · ≈ 4.2 s" loading="lazy"></iframe><figcaption><b>B · Swinging lamp · ≈ 4.2 s</b><span>The lamp hangs on an arm from the ceiling and swings like a pendulum from left to right; letters glow only under the beam, then the whole name lights up at the end.</span><span class="act"><button onclick="this.closest('figure').querySelector('iframe').src='ot-b.html?'+Date.now()">↻ Replay</button><a href="ot-b.html" target="_blank">Open full screen ↗</a></span></figcaption></figure><figure><iframe src="ot-c.html" title="C · Light pool + dust · ≈ 3.4 s" loading="lazy"></iframe><figcaption><b>C · Light pool + dust · ≈ 3.4 s</b><span>Just the light: a warm circular pool of OT light travels across the name with tiny dust specks floating in it; the trail it leaves stays lit.</span><span class="act"><button onclick="this.closest('figure').querySelector('iframe').src='ot-c.html?'+Date.now()">↻ Replay</button><a href="ot-c.html" target="_blank">Open full screen ↗</a></span></figcaption></figure><figure><iframe src="ot-d.html" title="D · Switch-on, then sweep · ≈ 4.4 s" loading="lazy"></iframe><figcaption><b>D · Switch-on, then sweep · ≈ 4.4 s</b><span>The OT lamp first switches on bulb by bulb (click-click-click), then sweeps left → right lighting the name, and finally lights the subtitle.</span><span class="act"><button onclick="this.closest('figure').querySelector('iframe').src='ot-d.html?'+Date.now()">↻ Replay</button><a href="ot-d.html" target="_blank">Open full screen ↗</a></span></figcaption></figure><figure><iframe src="ot-e.html" title="E · Two-pass reveal · ≈ 4.6 s" loading="lazy"></iframe><figcaption><b>E · Two-pass reveal · ≈ 4.6 s</b><span>The light sweeps the name left → right, then glides back right → left along the subtitle, lighting it; the scene then fades softly into the site.</span><span class="act"><button onclick="this.closest('figure').querySelector('iframe').src='ot-e.html?'+Date.now()">↻ Replay</button><a href="ot-e.html" target="_blank">Open full screen ↗</a></span></figcaption></figure></div></div></body></html>
