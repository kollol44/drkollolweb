<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dr. Fahim Foysal Kollol — Surgeon</title>
<meta name="description" content="Dr. Fahim Foysal Kollol — General, Laparoscopic, Breast & Colorectal Surgeon in Sherpur and Mymensingh.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--white:#fff;--tint:#EEF7F6;--aqua:#2BB3B1;--teal:#0B6E73;--ink:#062F31;--muted:#3f6668;
 --fh:'Fraunces',serif;--fb:'Inter',sans-serif}
.bn{--fh:'Anek Bangla',sans-serif;--fb:'Hind Siliguri',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;overflow-x:clip} /* clip, not hidden: hidden breaks position:sticky */
a{color:inherit;text-decoration:none}

/* ---------- NAV ---------- */
.nav{position:fixed;inset:12px 16px auto;z-index:50;display:flex;align-items:center;gap:16px;padding:10px 12px 10px 18px;
 border-radius:18px;background:rgba(255,255,255,.62);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
 border:1px solid rgba(43,179,177,.22);box-shadow:0 6px 30px -12px rgba(6,47,49,.18)}
.brand{display:flex;align-items:center;gap:10px;font:700 17px/1 var(--fh);white-space:nowrap}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--aqua),var(--teal));display:grid;place-items:center;color:#fff;font:700 15px 'Fraunces';font-style:normal}
.links{display:flex;gap:4px;margin:0 auto}
.links a,.dd>button{padding:9px 13px;border-radius:10px;font:500 14.5px var(--fb);color:var(--muted);transition:background .2s,color .2s;border:0;background:none;cursor:pointer}
.dd>button:hover{background:var(--tint);color:var(--teal)}
/* Conditions & Treatments dropdown (same as inner pages) */
.links{align-items:center}.dd{position:relative}
.dd>button:after{content:"";display:inline-block;margin-left:6px;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-3px) rotate(45deg)}
.dd-menu{position:absolute;top:calc(100% + 10px);left:50%;transform:translate(-50%,6px);min-width:260px;padding:8px;border-radius:16px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(43,179,177,.22);box-shadow:0 20px 50px -20px rgba(6,47,49,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.dd:hover .dd-menu,.dd.open .dd-menu{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.dd-menu a{display:block;padding:10px 12px;border-radius:10px;font:500 14.5px var(--fb);color:var(--ink)}
.dd-menu a:hover{background:var(--tint);color:var(--teal)}
.dd-menu a.all{font-weight:600;color:var(--teal);border-bottom:1px solid rgba(43,179,177,.28);margin-bottom:4px}
.sheet a.sub{padding:9px 14px 9px 28px;font-size:14.5px;color:var(--muted)}
.links a:hover,.links a.on{background:var(--tint);color:var(--teal)}
.right{display:flex;align-items:center;gap:8px;margin-left:auto}
.lang{display:flex;border:1px solid rgba(11,110,115,.25);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:7px 11px;font:600 12.5px Inter,'Hind Siliguri';color:var(--teal);cursor:pointer}
.lang button.on{background:var(--teal);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;border-radius:999px;padding:13px 22px;font:600 15px var(--fb);white-space:nowrap;transition:transform .2s,background .2s}
.btn-p{background:var(--teal);color:#fff;box-shadow:0 10px 26px -10px rgba(11,110,115,.75)}
.btn-p:hover{transform:translateY(-2px);background:#095c60}
.btn-g{background:rgba(255,255,255,.8);color:var(--teal);border:1px solid rgba(11,110,115,.3)}
.btn-g:hover{background:var(--tint)}
.nav .btn{padding:11px 18px;font-size:14.5px}
.burger{display:none;width:40px;height:40px;border-radius:12px;border:1px solid rgba(11,110,115,.25);background:#fff;cursor:pointer;place-items:center}
.burger span{display:block;width:18px;height:2px;background:var(--teal);box-shadow:0 6px 0 var(--teal),0 -6px 0 var(--teal)}
.sheet{position:fixed;inset:76px 16px auto;z-index:49;display:none;flex-direction:column;padding:10px;border-radius:18px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(43,179,177,.22)}
.sheet a{padding:13px 14px;border-radius:10px;font:500 16px var(--fb)}
.sheet.open{display:flex}

/* ---------- HERO ---------- */
.hero{position:relative;height:290vh} /* scroll length of the hero story: bigger = each scroll moves the cut less */
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#fff}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.loader{position:absolute;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,var(--aqua),var(--teal));transition:width .2s,opacity .5s;z-index:5}
.cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;font:500 12px var(--fb);color:#6a8c8d}
.cue b{width:22px;height:34px;border:1.5px solid #9dbcbc;border-radius:12px;position:relative}
.cue b:after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;border-radius:2px;background:var(--teal);transform:translateX(-50%);animation:wheel 1.6s infinite}
@keyframes wheel{0%{opacity:0;transform:translate(-50%,0)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,10px)}}

/* Text emerges out of the bleeding incision: the box's bottom edge sits on the red line and clips
   everything below it, so each line rises up out of the cut. 100% scroll-driven by JS. */
.emerge{position:absolute;overflow:hidden;pointer-events:none}
.emerge .ln{position:absolute;left:0;right:0;will-change:transform}
.t-h{font:700 clamp(28px,3vw,54px)/1.06 var(--fh);letter-spacing:-.015em}
.bn .t-h{font-weight:800;line-height:1.22}
.t-sub{font:500 clamp(16px,1.35vw,22px)/1.45 var(--fb);color:var(--muted)}
.t-sub em{font-style:normal;color:var(--teal);font-weight:600}
.t-cue{pointer-events:auto;display:inline-flex!important;align-items:center;gap:10px;font:600 clamp(13px,1vw,15px) var(--fb);color:var(--teal);letter-spacing:.02em}
.t-cue i{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--aqua);display:grid;place-items:center;font-style:normal;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}

/* ---------- MEET THE DOCTOR ---------- */
/* --edge-row = the hero's bottom pixel row, sampled live from the canvas (JS). The section starts with exactly
   those colours, so hero → doctor has no seam, then eases into the page tint further down. */
/* ONE pinned section: intro (name, stats) → curtain opens (left text exits left, right exits right) →
   treatments scroll behind the same doctor image. Section height = scroll length of the whole story. */
.doc{position:relative;height:calc(var(--n,8)*80vh + 230vh);
 background:linear-gradient(180deg,rgba(238,247,246,0) 0,rgba(238,247,246,0) 4vh,var(--tint) 95vh,var(--tint) 100%),var(--edge-row,#f2f2f1)}
.pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.glow{position:absolute;left:50%;top:58%;width:min(80vw,860px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
 background:radial-gradient(circle,rgba(43,179,177,.26) 0%,rgba(43,179,177,.08) 45%,transparent 70%);pointer-events:none}
.intro{position:absolute;left:0;right:0;top:max(11vh,84px);margin:0;text-align:center;z-index:1;white-space:nowrap;font:800 clamp(64px,12vw,200px)/.95 var(--fh);letter-spacing:-.04em}
.intro span{display:inline-block;will-change:transform,opacity;
 background:linear-gradient(180deg,var(--teal) 10%,rgba(43,179,177,.35) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.bn .intro{letter-spacing:0;line-height:1.15}
.doc-img{position:absolute;left:50%;bottom:0;height:min(80vh,740px);aspect-ratio:624/1126;transform:translateX(-50%);z-index:2}
.doc-img img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 30px 40px rgba(6,47,49,.22));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
.side{position:absolute;top:60%;transform:translateY(-50%);z-index:3;width:min(31vw,430px);will-change:translate,opacity}
.side.l{left:4.5vw}.side.r{right:4.5vw}
.name{margin:0;font:700 clamp(30px,2.9vw,50px)/1.08 var(--fh);letter-spacing:-.015em}
.bn .name{font-weight:800;line-height:1.2}
.role{margin:10px 0 0;font:600 clamp(15px,1.25vw,19px)/1.4 var(--fb);color:var(--teal)}
.deg{margin:14px 0 0;display:flex;flex-wrap:wrap;gap:7px}
.deg span{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid rgba(43,179,177,.3);font:600 13px var(--fb);color:var(--ink)}
.post{margin:12px 0 0;font:400 14.5px/1.6 var(--fb);color:var(--muted)}
.cta{margin-top:20px}
.cta .row{display:flex;gap:10px;flex-wrap:wrap}
.cta p{margin:12px 0 0;font:500 14px/1.6 var(--fb);color:var(--muted)}
.cta p strong{color:var(--teal)}
.cta-m{display:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.62);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
 border:1px solid rgba(43,179,177,.28);box-shadow:0 14px 34px -18px rgba(6,47,49,.35)}
.stat b{display:block;font:700 clamp(24px,2.1vw,34px)/1 var(--fh);color:var(--teal)}
.bn .stat b{font-weight:800}
.stat span{display:block;margin-top:6px;font:500 13px/1.35 var(--fb);color:var(--muted)}
/* first arrival reveal */
.rv{opacity:0;transform:translateY(30px);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

/* treatments phase (same pinned stage) */
.svc-head{position:absolute;left:0;right:0;top:92px;text-align:center;z-index:4;font:600 13px var(--fb);letter-spacing:.18em;text-transform:uppercase;color:var(--teal);opacity:0}
.bn .svc-head{letter-spacing:.02em;text-transform:none;font-size:15px}
/* category chips under the heading — the active category lights up as you scroll (no counter) */
.svc-chips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:12px auto 0;max-width:min(980px,94vw);letter-spacing:0;text-transform:none}
.svc-chips a{padding:6px 12px;border-radius:999px;font:600 12.5px var(--fb);color:var(--teal);background:rgba(255,255,255,.7);border:1px solid rgba(43,179,177,.3);transition:background .3s,color .3s}
.svc-chips a.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.svc-card{display:block;color:inherit}
.svc-card .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.svc-card .lapb{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:600 11.5px var(--fb);color:var(--teal);background:var(--tint);border:1px solid rgba(43,179,177,.3)}
.svc-card .lapb:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--aqua)}
.svc-card .go{font:600 13.5px var(--fb);color:var(--teal)}
.svc-card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.svc-card .tags a{padding:4px 10px;border-radius:999px;font:500 12.5px var(--fb);color:var(--ink);background:#fff;border:1px solid rgba(43,179,177,.3)}
.svc-card .tags a:hover{background:var(--tint)}
.svc-card .tags a.plus{display:none} /* "+N more" chip is phone-only */
/* floating, background-free condition image sitting on top of each homepage condition card */
.svc-card .ci{display:block;width:100%;height:170px;object-fit:contain;margin:-80px 0 6px;filter:drop-shadow(0 18px 26px rgba(6,47,49,.3))}
.svc-card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.svc-card .row .btn{padding:10px 16px;font-size:14px}
.svc-words{position:absolute;inset:0;z-index:1}
.svc-word{position:absolute;left:50%;top:50%;text-align:center;white-space:nowrap;will-change:transform,opacity;
 font:800 var(--fs,clamp(96px,18vw,340px))/.92 var(--fh);letter-spacing:-.04em;
 background:linear-gradient(180deg,var(--teal) 10%,rgba(43,179,177,.4) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.bn .svc-word{letter-spacing:0;line-height:1.1}
.svc-doc{position:absolute;left:50%;bottom:0;height:min(80vh,720px);aspect-ratio:624/1126;transform:translateX(-50%);z-index:2}
.svc-doc img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 30px 40px rgba(6,47,49,.2))}
.svc-card{position:absolute;z-index:3;width:min(330px,80vw);padding:18px 20px;border-radius:20px;background:rgba(255,255,255,.9);
 backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid rgba(43,179,177,.3);box-shadow:0 18px 40px -20px rgba(6,47,49,.4);will-change:transform,opacity}
.svc-card small{display:block;font:600 11.5px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--aqua)}
.bn .svc-card small{letter-spacing:.02em;text-transform:none;font-size:13px}
.svc-card b{display:block;margin-top:6px;font:700 22px/1.2 var(--fh);color:var(--ink)}
.svc-card p{margin:6px 0 0;font:400 14.5px/1.55 var(--fb);color:var(--muted)}
.svc-card.l{left:5vw;top:52%}.svc-card.r{right:5vw;top:36%}
.svc-bar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:4;display:flex;gap:6px}
.svc-bar i{width:18px;height:3px;border-radius:2px;background:rgba(11,110,115,.2);transition:background .3s,width .3s}
.svc-bar i.on{background:var(--teal);width:30px}

/* laptop: wide condition card on the free side, big floating image on its left half */
@media (min-width:861px){
 .svc-card.l:not(.more),.svc-card.r:not(.more){top:auto;bottom:6vh;width:min(46vw,640px);display:grid;grid-template-columns:minmax(0,48%) 1fr;column-gap:20px;align-items:center;padding:20px 24px 20px 14px}
 .svc-card.l:not(.more){left:3vw}.svc-card.r:not(.more){right:3vw}
 .svc-card:not(.more) .ci{grid-row:1 / span 4;width:100%;height:min(36vh,300px);margin:-60px 0 -6px}
 .svc-card:not(.more)>:not(.ci){grid-column:2}
 .svc-card:not(.more) b{font-size:26px}
}
@media (max-width:980px){.links{display:none}.burger{display:grid}.nav .btn-p{display:none}}
@media (max-width:860px){
 /* phone: name block on top, stats as a strip over the doctor, buttons at the bottom */
 .intro{top:10vh;font-size:clamp(52px,17vw,110px)}
 .doc-img{height:min(56vh,470px)}
 .side{top:auto;transform:none;width:auto}
 .side.l{left:16px;right:16px;top:calc(10vh + clamp(52px,17vw,110px) + 6px);text-align:center}
 .side.l .post,.side.l .cta{display:none}
 .name{font-size:clamp(24px,6.6vw,32px)}.role{font-size:13.5px;margin-top:6px}
 .deg{justify-content:center;margin-top:10px;gap:5px}.deg span{font-size:11.5px;padding:4px 9px}
 .side.r{left:12px;right:12px;bottom:92px}
 .stats{grid-template-columns:repeat(3,1fr);gap:8px}
 .stat{padding:9px 10px;border-radius:14px}.stat:nth-child(n+4){display:none}
 .stat b{font-size:19px}.stat span{font-size:11px;margin-top:3px}
 .cta-m{display:flex;gap:10px;position:absolute;left:12px;right:12px;bottom:18px;z-index:4;will-change:translate,opacity}
 .cta-m .btn{flex:1}
}
@media (max-width:860px){
 .svc-word{font-size:clamp(46px,14vw,90px);width:96vw;white-space:normal}
 .svc-doc{height:min(58vh,480px)}
 .svc-card,.svc-card.l,.svc-card.r{left:50%;right:auto;top:auto;bottom:24px;transform:translateX(-50%);width:min(360px,92vw);padding:14px 16px;max-height:34vh;overflow:auto}
 /* phone: keep the "And more" card below the doctor's crossed arms — compact tags, no paragraph */
 .svc-card .tags{gap:5px;margin-top:8px}.svc-card .tags a{font-size:11.5px;padding:3px 8px}
 .svc-card.more p{display:none}.svc-card.more .row{margin-top:10px;flex-wrap:nowrap}.svc-card.more .row .btn{flex:1;padding:9px 10px;font-size:13px}.svc-card.more b{font-size:17px}
 .svc-card.more{max-height:none;overflow:visible}
 /* phone: image pops half out of the card (like laptop) but stays small so the doctor's face stays clear */
 .svc-card:not(.more){max-height:none;overflow:visible}
 .svc-card .ci{height:104px;width:auto;max-width:62%;margin:-66px auto 2px}
 .svc-card.more .tags a:nth-child(n+7):not(.plus){display:none}
 .svc-card .tags a.plus{display:inline-block!important;background:var(--tint);color:var(--teal);font-weight:600}
 /* phone: one swipeable row of category chips instead of 3 wrapped rows */
 .svc-chips{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;max-width:100vw;padding:0 12px;scrollbar-width:none}
 .svc-chips::-webkit-scrollbar{display:none}
 .svc-chips a{flex:none}
 .svc-bar{display:none}
 .svc-card b{font-size:19px}.svc-card p{font-size:13.5px}
}
@media (max-width:560px){.nav{inset:10px 10px auto;padding:8px 8px 8px 12px}.brand{font-size:15px}.brand i{width:26px;height:26px}
 .t-h{font-size:clamp(26px,7.6vw,34px)}.t-sub{font-size:16px}
 .cta .btn{flex:1;min-width:140px}}

/* =====================================================================================
   HOMEPAGE PART 2 (after the conditions): tickers · How to get a serial · reviews · video · gallery · FAQ · blog · visit/map · footer
   ===================================================================================== */
.doc{height:calc(var(--n,8)*80vh + 330vh)} /* +100vh: the serial section rises over the pinned stage during this stretch */
.pin{transform-origin:50% 100%;will-change:transform,opacity}
/* ---- infinite right→left tickers (degrees inside the intro, numbers on top of the serial section) ---- */
.tkr{overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tkr .trk{display:inline-flex;align-items:center;animation:tkr var(--dur,40s) linear infinite}
.tkr:hover .trk{animation-play-state:paused}
.tkr .it{display:inline-flex;align-items:baseline;gap:8px;padding:0 22px;font:600 15px var(--fb);color:var(--muted)}
.tkr .it b{font:800 clamp(22px,2vw,30px)/1 var(--fh);color:var(--teal)}
.tkr .sep{color:var(--aqua);font-size:14px}
@keyframes tkr{to{transform:translateX(-50%)}}
.tkr-deg{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:12px 0;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(43,179,177,.25);will-change:translate,opacity}
.tkr-deg .it{font:700 15px var(--fb);color:var(--teal);letter-spacing:.02em}
/* ---- How to get a serial: rises over the conditions (sticky stack), then one step per scroll ---- */
.hs{position:relative;z-index:6;margin-top:-100vh;height:calc(3*95vh + 100vh);background:#fff;border-radius:34px 34px 0 0;box-shadow:0 -30px 60px -30px rgba(6,47,49,.4)}
.hs:before{content:"";position:absolute;left:8%;right:8%;top:0;height:2px;z-index:7;border-radius:2px;background:linear-gradient(90deg,transparent,var(--aqua) 30%,#7fe3df 50%,var(--aqua) 70%,transparent);box-shadow:0 0 18px 2px rgba(43,179,177,.55)}
.hs-pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;border-radius:34px 34px 0 0;background:radial-gradient(ellipse 60% 50% at 50% 100%,rgba(43,179,177,.16),transparent 70%),linear-gradient(180deg,#fff,var(--tint))}
.tkr-num{position:absolute;left:0;right:0;top:max(84px,11vh);padding:12px 0 10px;border-top:1px solid rgba(43,179,177,.22);border-bottom:1px solid rgba(43,179,177,.22);background:rgba(255,255,255,.6)}
.hs-h{position:absolute;left:0;right:0;top:calc(max(84px,11vh) + 74px);margin:0;text-align:center;white-space:nowrap;font:800 var(--fs,clamp(54px,8.5vw,140px))/1 var(--fh);letter-spacing:-.035em;
 background:linear-gradient(180deg,var(--teal) 10%,rgba(43,179,177,.45) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.bn .hs-h{letter-spacing:0;line-height:1.2}
.hs-cards{position:absolute;left:0;right:0;bottom:9vh;height:min(52vh,470px)}

 $$('revs').innerHTML=h.revs.map(r=>`<div class="rev glass"><div style="display:flex;justify-content:space-between;align-items:center"><span class="st">★★★★★</span><span class="tag-s">${h.sample}</span></div><q>${r.q}</q><div class="who"><span class="av">${r.n.replace(/[.\s]/g,'').slice(0,l==='bn'?3:2)}</span><div><b>${r.n}</b><span>${r.m}</span></div></div></div>`).join('');
 $$('vdEb').textContent=h.vdEb;$$('vdH').textContent=h.vdH;$$('vdLead').textContent=h.vdLead;
 $$('vid').innerHTML=`<div class="ph main"><div><span class="play"></span><small>${h.soon}</small></div></div><div class="stack">${[1,2,3].map(()=>`<div class="ph"><div><span class="play sm"></span></div></div>`).join('')}</div>`;
 $$('glEb').textContent=h.glEb;$$('glH').textContent=h.glH;$$('glLead').textContent=h.glLead;
 $$('gal').innerHTML=h.gal.map(g=>`<div class="ph"><div><b>${g}</b><small>${h.gsoon}</small></div></div>`).join('');
 $$('fqEb').textContent=h.fqEb;$$('fqH').textContent=h.fqH;
 $$('faqList').innerHTML=h.faq.map(([q,a],i)=>`<details class="glass"${i?'':' open'}><summary>${q}</summary><p>${a}</p></details>`).join('');
 $$('bgEb').textContent=h.bgEb;$$('bgH').textContent=h.bgH;
 $$('blogs').innerHTML=h.blogs.map(([c2,t,p])=>`<a class="blog glass" href="#"><div class="ph"><div><span class="tag-s">${h.bsoon}</span></div></div><div class="bd"><small>${c2}</small><h3>${t}</h3><p>${p}</p><span class="go">${h.bmore}</span></div></a>`).join('');
 $$('vBig').textContent=c.brand;
 $$('vCta').innerHTML=`<h3>${h.vH}</h3><p>${h.vP}</p><div class="row"><a class="btn btn-p" href="tel:${SERIAL_NO}">${h.book}</a><a class="btn btn-g" href="tel:${CALL_NO}">${h.call}</a><a class="btn btn-g" href="${WA_URL}" target="_blank" rel="noopener">${h.wa}</a></div>`;
 $$('vChs').innerHTML=h.ch.map((x,i)=>`<button class="v-ch glass" data-i="${i}"><small>${x.t}</small><b>${x.n}</b><span>${x.a}</span><em>${h.dir}</em></button>`).join('');
 $$('vMap').innerHTML=`<div class="mh"><div><b>${h.mapH}</b><span>${h.mapS}</span></div></div><iframe id="mapFrame" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe><p class="note" id="mapNote"></p>`;
 const pick=i=>{const x=h.ch[i];document.querySelectorAll('.v-ch').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  $$('mapFrame').src=`https://maps.google.com/maps?q=${encodeURIComponent(x.q)}&z=16&output=embed`;$$('mapNote').textContent=x.ok?'':h.mapNote};
 document.querySelectorAll('.v-ch').forEach(b=>b.onclick=e=>{const i=+b.dataset.i;if(b.classList.contains('on'))window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(h.ch[i].q)}`,'_blank','noopener');else pick(i)});
 pick(0);
 $$('hfoot').innerHTML=`<div class="wrap"><div><b>${h.foot[0]}</b><br>${h.foot[1]}</div><div>${h.foot[2]}: <a href="tel:${SERIAL_NO}">${l==='bn'?BNd(SERIAL_NO):SERIAL_NO}</a><br>${h.foot[3]}: <a href="tel:${CALL_NO}">${l==='bn'?BNd(CALL_NO):CALL_NO}</a></div><div>© ${l==='bn'?'২০২৬':'2026'}</div></div>`}
addEventListener('resize',()=>{fitHsH();const l=document.documentElement.lang||'en';fillTicker(tkrDeg,HX[l].deg.map(d=>`<span class="it">${d}</span>`))});
/* numbers ticker counts up each time it comes into view */
new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.querySelectorAll('b[data-t]').forEach(countUp)}),{threshold:.4}).observe(tkrNum);
/* serial section: rises over the conditions stage (stage eases back), then one step per scroll —
   laptop: cards travel right → centre → left (horizontal) · phone: bottom → centre → top (vertical) */
let hsLast='';
function hsDraw(){const vh=innerHeight,r=serialEl.getBoundingClientRect(),cover=clamp(1-r.top/vh,0,1),mob=innerWidth<860;
 pinEl.style.transform=cover>0&&cover<1?`scale(${1-.06*cover})`:cover>=1?'scale(.94)':'';pinEl.style.opacity=cover>0?1-.5*cover:'';
 const n=hsEls.length;if(!n)return;const q=clamp(-r.top/(serialEl.offsetHeight-vh),0,1),pos=restH(q*(n-1))-(1-cover),key=pos.toFixed(4)+mob+innerWidth;if(key===hsLast)return;hsLast=key;
 hsEls.forEach((el,i)=>{const o=i-pos,a=Math.abs(o);
  if(mob){el.style.transform=`translateY(${o*72}vh) scale(${1-Math.min(a,1)*.08})`;el.style.opacity=clamp(1-a*1.6,0,1)}
  else{el.style.transform=`translateX(${o*46}vw) scale(${1-Math.min(a,1.5)*.16})`;el.style.opacity=a>1.7?0:clamp(1-a*.55,0,1)}
  el.style.zIndex=10-Math.round(a*2);el.style.pointerEvents=a<.5?'auto':'none';el.classList.toggle('cur',a<.5)});
 [...hsBar.children].forEach((b,i)=>b.classList.toggle('on',Math.round(clamp(pos,0,n-1))===i))}

/* ================= VIDEO / STORY CONFIG =================
   Frames: frames/<mode>/001.webp … (ffmpeg, 30fps).  Blade path measured on the frames (fractions of the frame):
   the blade touches down at `touch` seconds, then cuts left→right along y. */
const CFG={
 wide:{n:111,y:.811,touch:1.27,path:[[1.27,.165],[2.47,.316],[3.67,.47]]},
 tall:{n:113,y:.795,touch:.63,path:[[.63,.114],[1.97,.278],[3.54,.47]]}};
const STORY={
 descend:.06,   /* 0 → .06 : blade comes down and touches — the very first scroll starts the cut */
 cutEnd:.62,    /* .06 → .62 : incision drawn left→right */
 groups:[[.14,.42],[.42,.62],[.66,.8]]  /* scroll windows: 1 headline, 2 second line, 3 "meet your surgeon" */
};
const fps=30;

/* ================= STATE ================= */
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d'),em=$('em'),cue=$('cue'),ld=$('ld'),hero=$('hero');
const lines=[...em.querySelectorAll('.ln')];
let mode,C,W=1600,H=900,view={s:1,ox:0,oy:0},pS=0,lastKey='';
const SETS={wide:{f:[],bm:new Map(),started:false},tall:{f:[],bm:new Map(),started:false}};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t,seg=(v,a,b)=>clamp((v-a)/(b-a),0,1);
const ease=t=>1-Math.pow(1-t,3);

/* ================= LANGUAGE / MENU ================= */
function setLang(l){document.documentElement.lang=l;document.body.classList.toggle('bn',l==='bn');
 document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=COPY[l][e.dataset.t]);
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
 try{localStorage.setItem('kollol-lang',l)}catch(e){} lastKey='';buildServices(l);buildHome(l);(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{lastKey=''})}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
document.querySelector('.burger').onclick=()=>document.querySelector('.sheet').classList.toggle('open');
{const dd=document.querySelector('.dd');dd.querySelector('button').onclick=()=>dd.classList.toggle('open');document.addEventListener('click',e=>{if(!dd.contains(e.target))dd.classList.remove('open')})}

/* ================= FRAMES (coarse-to-fine so the whole cut is scrubbable almost immediately) ================= */
function order(n){const o=[],seen=new Set();for(let st=16;st>=1;st>>=1)for(let i=0;i<n;i+=st)if(!seen.has(i)){seen.add(i);o.push(i)}if(!seen.has(n-1))o.splice(1,0,n-1);return o}
async function load(){
 mode=innerWidth/innerHeight<.9?'tall':'wide';C=CFG[mode];const S=SETS[mode],m=mode;lastKey='';
 const url=i=>`frames/${m}/${String(i+1).padStart(3,'0')}.webp`;
 const get=async i=>{if(S.f[i])return;const b=await (await fetch(url(i))).blob();S.f[i]=b;S.bm.set(i,await createImageBitmap(b))};
 await get(0);const b0=S.bm.get(0);W=b0.width;H=b0.height;resize();
 if(S.started)return;S.started=true;const q=order(C.n);let k=0,done=0;
 const worker=async()=>{while(k<q.length){const i=q[k++];await get(i);done++;if(m===mode){ld.style.width=(100*done/C.n)+'%';lastKey=''}}};
 await Promise.all(Array.from({length:6},worker));if(m===mode)ld.style.opacity=0}
function frameBitmap(i){const bm=SETS[mode].bm;if(bm.has(i))return bm.get(i);for(let d=1;d<C.n;d++){if(bm.has(i-d))return bm.get(i-d);if(bm.has(i+d))return bm.get(i+d)}return null}

/* ================= GEOMETRY ================= */
function resize(){if(!C)return;const dpr=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
 const s=Math.max(innerWidth/W,innerHeight/H),dw=W*s;
 const centre=(innerWidth-dw)/2,safe=20-C.path[0][1]*dw; /* narrow phones: keep the start of the cut on screen */
 view={s,ox:clamp(Math.max(centre,Math.min(0,safe)),innerWidth-dw,0),oy:(innerHeight-H*s)/2};lastKey='';edgeDone=false}
const sx=fx=>view.ox+fx*W*view.s, sy=fy=>view.oy+fy*H*view.s;
const phone=()=>innerWidth<560;

function timeAt(p){const d=CFG[mode],end=(d.n-1)/fps;
 if(p<STORY.descend)return lerp(0,d.touch,p/STORY.descend);
 if(p<STORY.cutEnd)return lerp(d.touch,d.path[d.path.length-1][0],(p-STORY.descend)/(STORY.cutEnd-STORY.descend));
 return lerp(d.path[d.path.length-1][0],end,seg(p,STORY.cutEnd,1))}
function tipAt(t){const p=C.path;if(t<=p[0][0])return p[0][1];for(let i=1;i<p.length;i++)if(t<=p[i][0])return lerp(p[i-1][1],p[i][1],(t-p[i-1][0])/(p[i][0]-p[i-1][0]));return p[p.length-1][1]}

/* ================= DRAW: frame + bleeding incision ================= */
const BEADS=Array.from({length:16},(_,i)=>({f:(i+.5)/16+((i*37)%7-3)/260,r:.5+((i*53)%10)/13,d:((i*29)%9-4)/12,late:((i*17)%5)/100}));
function drawCut(t){const x0=C.path[0][1],x1=C.path[C.path.length-1][1],tip=tipAt(t);if(t<C.touch||tip-x0<.002)return tip;
 const a=sx(x0),b=sx(tip),y=sy(C.y),u=Math.max(1,view.s*W/1300);
 const g=cx.createLinearGradient(0,y-3*u,0,y+3*u);g.addColorStop(0,'#6d0a10');g.addColorStop(.5,'#b3141d');g.addColorStop(1,'#56060a');
 cx.lineCap='round';cx.strokeStyle=g;cx.lineWidth=2.4*u;cx.beginPath();cx.moveTo(a,y);
 for(let x=a;x<b;x+=5*u)cx.lineTo(x,y+Math.sin(x*.09)*.3*u);cx.lineTo(Math.max(a,b-1.5*u),y);cx.stroke();
 cx.strokeStyle='rgba(255,255,255,.35)';cx.lineWidth=.7*u;cx.beginPath();cx.moveTo(a,y-.8*u);cx.lineTo(Math.max(a,b-3*u),y-.8*u);cx.stroke();
 BEADS.forEach(k=>{const fx=x0+k.f*(x1-x0),age=(tip-fx-k.late)/.045;if(age<=0)return;const gr=ease(clamp(age,0,1)),px=sx(fx),py=y+k.d*u,rx=k.r*3.6*u*gr,ry=k.r*2.4*u*gr;
  const rg=cx.createRadialGradient(px-rx*.3,py-ry*.4,0,px,py,rx);rg.addColorStop(0,'#d62a33');rg.addColorStop(.55,'#9e121b');rg.addColorStop(1,'#55050a');
  cx.fillStyle=rg;cx.beginPath();cx.ellipse(px,py,rx,ry,0,0,7);cx.fill();
  cx.fillStyle='rgba(255,255,255,.6)';cx.beginPath();cx.ellipse(px-rx*.35,py-ry*.35,rx*.22,ry*.18,0,0,7);cx.fill()});
 return tip}

/* ================= TEXT: rises up out of the red line (desktop + phone), scrubbed by scroll =================
   Each line has a resting spot; while it emerges it is pushed down to the incision and clipped there,
   so it looks like it is coming out of the cut. Fresh text is blood-red and blurred, then settles to ink. */
function placeText(){const y=sy(C.y),left=Math.max(20,sx(C.path[0][1]));
 if(phone()){ /* phone: hand fills the right side above the cut, so text rises up the empty left/top area */
  em.style.left=left+'px';em.style.width=(innerWidth-left-20)+'px';em.style.top='84px';em.style.height=(y-84-2)+'px';
 }else{em.style.left=left+'px';em.style.width=Math.max(300,sx(C.path[C.path.length-1][1])-left-12)+'px';em.style.top='84px';em.style.height=(y-84-2)+'px'}
 /* resting layout: stacked from the bottom of the box (just above the cut) upwards */
 const gap=phone()?12:16,box=em.clientHeight;let bottom=0;
 const rest=[...lines].reverse().map(el=>{const h=el.offsetHeight,top=box-bottom-h;bottom+=h+gap;return[el,top]});
 if(phone()){ /* phone: park the settled text high up in the empty white area, well clear of the hand */
  const total=bottom-gap,shift=Math.max(0,box-total-box*.18);rest.forEach(r=>r[1]-=shift)}
 rest.forEach(([el,top])=>el.dataset.top=top)}
function drawText(p,tip){const box=em.clientHeight;
 /* desktop: release text only over the part that is already cut (clip at the blade tip) until the cut is done */
 if(!phone()){const tipX=sx(tip)-em.getBoundingClientRect().left-14;em.style.clipPath=p<STORY.cutEnd?`inset(-60px ${Math.max(0,em.clientWidth-tipX)}px 0 -60px)`:'none'}
 else em.style.clipPath='none';
 lines.forEach(el=>{const[a,b]=STORY.groups[el.dataset.g-1],e=ease(seg(p,a,b)),top=+el.dataset.top;
  const y=lerp(box,top,e);                        /* from the incision (box bottom) up to its resting spot */
  el.style.transform=`translateY(${y}px)`;el.style.top='0';
  el.style.opacity=e<=0?0:.25+.75*e;
  el.style.filter=e<1?`blur(${(1-e)*3}px)`:'none';
  el.style.color=e<1&&!el.classList.contains('t-cue')?`rgb(${Math.round(lerp(158,6,e))},${Math.round(lerp(18,47,e))},${Math.round(lerp(27,49,e))})`:''})}

/* ================= SEAMLESS HAND-OFF: copy the hero's bottom pixel row into the doctor section's background ================= */
let edgeDone=false,edgeKey='';
function sampleEdge(){const n=24,row=cx.getImageData(0,cv.height-1,cv.width,1).data,bw=Math.floor(cv.width/n),stops=[];
 for(let k=0;k<n;k++){let r=0,g=0,b=0;for(let x=k*bw;x<(k+1)*bw;x++){const o=x*4;r+=row[o];g+=row[o+1];b+=row[o+2]}
  stops.push(`rgb(${Math.round(r/bw)},${Math.round(g/bw)},${Math.round(b/bw)}) ${((k+.5)/n*100).toFixed(1)}%`)}
 const v=`linear-gradient(90deg,${stops.join(',')})`;if(v!==edgeKey){edgeKey=v;$('doctor').style.setProperty('--edge-row',v)}edgeDone=true}

/* ================= LOOP: everything follows scroll (down = cut forward, up = reverse) ================= */
function progress(){const r=hero.getBoundingClientRect();return clamp(-r.top/(hero.offsetHeight-innerHeight),0,1)}
function tick(){
 const p=progress();pS+=(p-pS)*.28;if(Math.abs(p-pS)<.0004)pS=p;
 if(C){const t=timeAt(pS),i=clamp(Math.round(t*fps),0,C.n-1),key=mode+i+'|'+pS.toFixed(4)+'|'+innerWidth+'x'+innerHeight;
  if(key!==lastKey){lastKey=key;const bm=frameBitmap(i);
   if(bm){cx.fillStyle='#fff';cx.fillRect(0,0,innerWidth,innerHeight);cx.drawImage(bm,view.ox,view.oy,W*view.s,H*view.s)}
   const tip=drawCut(i/fps);placeText();drawText(pS,tip);
   if(bm&&(pS>.9||!edgeDone))sampleEdge()}
  cue.style.opacity=1-seg(pS,0,.04)}
 svcDraw();hsDraw();
 requestAnimationFrame(tick)}

/* ================= DOCTOR SECTION: first-arrival reveal ================= */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');else if(e.boundingClientRect.top>0)e.target.classList.remove('in')}),{threshold:.15});
statIO.observe(sideR);
document.querySelectorAll('.rv').forEach(el=>{el.style.transitionDelay=(el.closest('.stats')?[...el.parentNode.children].indexOf(el)*.08:0)+'s';io.observe(el)});

let L0='en';try{L0=localStorage.getItem('kollol-lang')||'en'}catch(e){}
setLang(L0);
addEventListener('resize',()=>{const m=innerWidth/innerHeight<.9?'tall':'wide';if(m!==mode)load();else resize()});
load();requestAnimationFrame(tick);
</script>
